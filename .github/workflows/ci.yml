name: تحقق مستمر

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: فحص التطبيق واختباره
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: جلب الكود
        uses: actions/checkout@v4

      - name: إعداد pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: إعداد Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: تثبيت الاعتمادات
        run: pnpm install --frozen-lockfile

      - name: فحص الأنواع
        run: pnpm check

      - name: تشغيل الاختبارات
        run: pnpm test

      - name: بناء نسخة الإنتاج
        run: pnpm build
